<!doctype html>
<!--
  The site had two pages before the redesign and this was one of them. It is
  linked from the repository README, from the release notes and from wherever
  anybody else has put it, so it keeps working rather than becoming a 404.

  Written by hand rather than configured: Astro's `redirects` emits a directory
  for a key ending in `.html` and drops the base path from the destination, so
  it produces neither the URL that was published nor one that resolves. This is
  copied to the site root verbatim.
-->
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Moved — Using this data</title>
<meta http-equiv="refresh" content="0; url=/gb-transit/feeds/using-this-data/">
<link rel="canonical" href="https://planarnetwork.github.io/gb-transit/feeds/using-this-data/">
<meta name="robots" content="noindex">
</head>
<body>
<p>This page has moved to
<a href="/gb-transit/feeds/using-this-data/">planarnetwork.github.io/gb-transit/feeds/using-this-data/</a>.</p>
</body>
</html>
