name: Website

on:
  push:
    branches: [ master ]
    paths:
      - 'apps/website/**'
      - '.github/workflows/pages.yml'
  # The site reports the current feed, so it is rebuilt after one is published
  # rather than only when its own source changes.
  workflow_run:
    workflows: ["Nightly feed"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: yarn install --immutable

      # Before the build, because everything in `public/` is copied into the
      # site as it stands.
      - name: Publish the feed alongside the site
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            https://github.com/planarnetwork/gb-transit/releases/latest/download/gtfs.zip \
            -o apps/website/public/gtfs.zip
          ls -lh apps/website/public/gtfs.zip

      # The site is built by astro rather than by the repository's `tsc -b`, so
      # nothing here has needed the workspaces compiled until now. Splitting the
      # patterns runs one of them.
      - run: yarn build

      # A release carries the patterns as one file because a release takes 1000
      # assets and the network has 2,797 stations. Serving them is the other way
      # round: a planner wants the station somebody is departing from and not the
      # rest of the country, so the file is broken up here rather than rebuilt.
      # Nothing is generated - the scan already ran, this is a read and a write.
      #
      # Not fatal if it is missing. A night whose scan did not finish publishes a
      # feed without patterns, and the site should still go up.
      - name: Publish the transfer patterns, whole and a station at a time
        run: |
          if curl -fsSL --retry 3 --retry-delay 5 \
            https://github.com/planarnetwork/gb-transit/releases/latest/download/transfer-patterns.gz \
            -o apps/website/public/transfer-patterns.gz
          then
            yarn tsx apps/transfer-patterns/src/index.ts split \
              apps/website/public/transfer-patterns.gz \
              --out apps/website/public/transfer-patterns
            du -sh apps/website/public/transfer-patterns.gz apps/website/public/transfer-patterns
          else
            rm -f apps/website/public/transfer-patterns.gz
            echo "The latest release has no transfer-patterns.gz, so the site goes up without them."
          fi

      # The site is its own build now rather than part of the repository's
      # `tsc -b`, and it reads the latest release over the network to report what
      # the feed currently holds. A build that cannot reach it still deploys; it
      # just has less to say.
      - run: yarn workspace @gb-transit/website run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/website/dist
      - id: deploy
        uses: actions/deploy-pages@v4
