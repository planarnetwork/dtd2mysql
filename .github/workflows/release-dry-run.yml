name: Release dry run

on:
  pull_request:
    branches:
      - master

jobs:
  dry-run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: yarn install --immutable
      - run: yarn build
      # What would this pull request release, if anything? No changeset is a
      # legitimate answer - it means nothing user-facing changed.
      - run: yarn changeset status --since=origin/master
        continue-on-error: true
      # List what the package would ship, so a broken `files`, `main` or `bin`
      # surfaces here rather than during a release.
      - run: yarn workspaces foreach -A --no-private --topological pack --dry-run
