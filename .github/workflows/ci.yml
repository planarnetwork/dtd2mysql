name: Test

on:
  # Every pull request, not only the ones targeting master, so a branch stacked
  # on another branch is still tested.
  pull_request:
  push:
    branches:
      - master

jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        version: ['26']
      fail-fast: false
    steps:
      - uses: actions/checkout@v5
      # A conflict marker in a workflow file makes it unparseable, which GitHub
      # reports as a run that failed before any job started - easy to read as the
      # workflow simply not triggering.
      - name: No conflict markers
        run: |
          ! git grep -n -E '^(<<<<<<< |=======$|>>>>>>> )' -- . ':!*.spec.ts'
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.version }}
      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: yarn install --immutable
      # tsc -b walks the project references in dependency order, so a type error
      # is reported against the package that contains it.
      - run: yarn build
      # Each workspace is a vitest project named after its package, so a failure
      # names the package rather than the repository.
      - run: yarn vitest run
      # The CLI has to work from the repository root as well as from its own
      # directory: tsx takes its compiler options from the nearest tsconfig whose
      # include matches the file.
      - run: yarn tsx apps/dtd2mysql/src/index.ts --help

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
      - uses: actions/cache@v4
        with:
          path: .yarn/cache
          key: yarn-${{ runner.os }}-${{ hashFiles('yarn.lock') }}
          restore-keys: yarn-${{ runner.os }}-
      - run: yarn install --immutable
      # Tests run against source, so main, bin and files breakage is invisible to
      # them. Install the tarball into a clean directory and run the CLI from it.
      - name: Install the packaged tarball and run it
        run: |
          yarn workspace dtd2mysql pack --out "$RUNNER_TEMP/dtd2mysql.tgz"
          mkdir -p "$RUNNER_TEMP/install" && cd "$RUNNER_TEMP/install"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "$RUNNER_TEMP/dtd2mysql.tgz"
          ./node_modules/.bin/dtd2mysql --help | tee help.txt
          grep -q "Usage: dtd2mysql" help.txt
          grep -q -- "--gtfs-zip" help.txt
